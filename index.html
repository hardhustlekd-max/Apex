    <!-- Decouple browser and OS theme enforcement via explicit color-scheme -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#070b12" id="meta-theme-color" />

    <!--
      CRITICAL: Blocking Inline Theme Hydration Script.
      Prevents Flash of Unstyled Theme (FOUT) / White Flash before first layout paint.
      1. Reads saved mode from localStorage ('theme').
      2. 100% System and Browser Independent: Defaults to 'dark' regardless of OS or browser settings.
      3. Synchronously applies 'data-theme' attribute, style.colorScheme, and 'dark' class to <html>.
    -->
    <script>
      (function() {
        try {
          var savedMode = localStorage.getItem('theme');
          var effectiveTheme = (savedMode === 'light' || savedMode === 'dark') ? savedMode : 'dark';
          var savedColorTheme = localStorage.getItem('app_color_theme') || 'opta-emerald';

          document.documentElement.setAttribute('data-theme', effectiveTheme);
          document.documentElement.setAttribute('data-color-theme', savedColorTheme);
          document.documentElement.style.colorScheme = effectiveTheme;
          if (effectiveTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', effectiveTheme === 'dark' ? '#070b12' : '#f1f5f9');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-color-theme', 'opta-emerald');
          document.documentElement.style.colorScheme = 'dark';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
